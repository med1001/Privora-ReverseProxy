name: Deploy Reverse Proxy to EC2

on:
  push:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Proxy
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/reverse-proxy:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~
            # 1. S'assurer que le réseau existe (sécurité suite à nos tests précédents)
            docker network create my-network || true
            
            # 2. Récupérer la nouvelle image
            docker pull ${{ secrets.DOCKER_USERNAME }}/reverse-proxy:latest
            
            # 3. Relancer le proxy avec la V2
            # On utilise le nom du service défini dans ton docker-compose.yml (probablement nginx-proxy)
            docker compose up -d --force-recreate nginx-proxy
            
            # 4. Nettoyage
            docker image prune -f
